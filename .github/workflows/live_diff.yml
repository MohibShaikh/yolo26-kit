name: Live Diff
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  live-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + latest ultralytics
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -U ultralytics
      - id: diff
        name: Run live-diff
        run: |
          if python scripts/live_diff.py; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: File drift issue
        if: steps.diff.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('live_diff_report.txt', 'utf-8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drift] live-diff detected upstream change ${date}`,
              body: '```\n' + body + '\n```',
              labels: ['drift'],
            });
