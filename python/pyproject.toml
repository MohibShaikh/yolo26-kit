[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yolo26-kit"
version = "0.1.1"
description = "YOLO26 ↔ YOLOv8-pipeline bridge: shape adapters, decoder, letterbox, and ORT wrappers."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "yolo26-kit contributors" }]
keywords = ["yolo", "yolo26", "object-detection", "onnx", "computer-vision"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
ort = ["onnxruntime>=1.17"]
pil = ["Pillow>=10"]
cv2 = ["opencv-python-headless>=4.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-benchmark>=4",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "ultralytics>=8.3",
  "Pillow>=10",
  "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://github.com/MohibShaikh/yolo26-kit"
Issues = "https://github.com/MohibShaikh/yolo26-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo26_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
